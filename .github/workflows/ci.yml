name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS, Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete test suite
        run: python -m pytest -q

  quality:
    name: Static and documentation contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Enforce macOS-only architecture
        run: python scripts/check_macos_only.py
      - name: Validate documented calls
        run: FCP_MCP_PROFILE=full python scripts/check_contracts.py

  coverage:
    name: Coverage floors
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Measure coverage
        run: >-
          python -m pytest
          --cov=fcp_mcp
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=60
      - name: Enforce trust-module coverage
        run: python scripts/check_new_module_coverage.py coverage.json

  audit:
    name: Dependency audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Audit installed dependencies
        run: pip-audit --local

  build:
    name: Build and installed-wheel smoke
    runs-on: macos-latest
    needs: [test, quality, coverage, audit]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build wheel and source distribution
        run: |
          rm -rf build dist
          python -m build
          python -m twine check dist/*
      - name: Verify source-distribution support files
        run: |
          tar -tf dist/fcp_mcp-0.2.1.tar.gz > /tmp/fcp-mcp-sdist-files
          rg -q 'examples/quickstart.py' /tmp/fcp-mcp-sdist-files
          rg -q 'docs/research/' /tmp/fcp-mcp-sdist-files
          rg -q 'WORKFLOWS.md' /tmp/fcp-mcp-sdist-files
          rg -q 'server.json' /tmp/fcp-mcp-sdist-files
      - name: Smoke-test installed wheel
        env:
          FCP_MCP_PROFILE: full
        run: |
          python -m venv /tmp/fcp-mcp-wheel-smoke
          /tmp/fcp-mcp-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/fcp-mcp-wheel-smoke/bin/python -m pip install dist/fcp_mcp-0.2.1-py3-none-any.whl
          mkdir -p "${RUNNER_TEMP}/fcp-mcp-output"
          FCP_MCP_OUTPUT_DIR="${RUNNER_TEMP}/fcp-mcp-output" \
          FCP_MCP_ALLOWED_ROOTS="${RUNNER_TEMP}/fcp-mcp-output" \
          FCP_MCP_ENABLE_LIVE_CONTROL=0 \
          /tmp/fcp-mcp-wheel-smoke/bin/python scripts/wheel_smoke.py \
            --command /tmp/fcp-mcp-wheel-smoke/bin/fcp-mcp
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fcp-mcp-v0.2.1-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
